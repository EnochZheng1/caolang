# Publishes the package to npm when a GitHub Release is published.
# One-time setup: create an npm "Automation" (or granular, publish-only) token
# at npmjs.com → Access Tokens, and add it as the repo secret NPM_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret).
# The release tag must match package.json's version, e.g. v0.2.0.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance: links the package to this repo and build

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} doesn't match package.json version $VERSION"
            exit 1
          fi
      # prepublishOnly builds and runs the tests first
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
