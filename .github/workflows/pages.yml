# Builds the playground and 《逃离996》 and publishes them to GitHub Pages:
#   https://<user>.github.io/caolang/         — playground
#   https://<user>.github.io/caolang/996.html — the game, full screen
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: playground
      - run: npx vite build
        working-directory: playground
      - name: Build the game page
        run: >
          npx tsx src/cli.ts build examples/逃离996.cao --网页 -o playground/dist/996.html
          "--标题=逃离996 — 用中文梗编程语言写的 3D 游戏"
          "--描述=下班了老板不让走？用辞职信砸他们，找到出口润出去！一个 100% 用「草语言」写的 3D 第一人称游戏，手机也能玩。"
          "--预览图=https://enochzheng1.github.io/caolang/social-preview.png"
          "--网址=https://enochzheng1.github.io/caolang/996.html"
          "--源码=https://github.com/EnochZheng1/caolang"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
